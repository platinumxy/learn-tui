[package]
name = "edlearn_client"
version = "0.2.0"
description = "A client for Edinburgh Uni's Learn API"
homepage = "https://git.tardisproject.uk/tcmal/learn-tui"
documentation = "https://docs.rs/edlearn_client"
repository = "https://github.com/tcmal/learn-tui"
readme = "../../README.md"
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
log = { workspace = true }
reqwest = { version = "0.11.24", features = ["blocking", "cookies",  "json"] }
reqwest_cookie_store = "0.6.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1.0.51"
thirtyfour = "0.37.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
uoe-ms-auth = { path = "../uoe-ms-auth", default-features = false, features= ["show-browser"] }
url = "2.5.7"
